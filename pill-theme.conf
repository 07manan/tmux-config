# ═══════════════════════════════════════════════════════════
#  Rounded-pill status bar — true colour (24-bit)
#
#  bar bg      default    the terminal's own background (iTerm2 dark is
#                       #15191f), so the pills float on the terminal itself
#  canvas      #151921   menu and popup background
#  pill        #202733   inactive pill fill
#  text dim    #727f92   window index, secondary labels, session divider
#  text        #909bad   inactive window name
#  text bright #e0e6f0   selected text
#  accent      #9ab5dd   identity blue — active window, clock, session name
#  accent mid  #7794c7   copy-mode pill, activity highlight
#  accent deep #5f7fb3   search matches, pane numbers, menu border
#  accent dark #2e405e   active index block, date block, selection fill
#  ink         #0f131b   text on light fills
#  warn        #dcb27e   prefix armed / bell
#  border      #2c3442   pane and popup borders, inactive index block
#
#  Pill construction:  #[fg=FILL,bg=BAR]#[fg=INK,bg=FILL] text #[fg=FILL,bg=BAR]
#  The caps ( U+E0B6,  U+E0B4) are drawn as FOREGROUND in the pill
#  colour over the bar background — that is what rounds the ends.
#  Requires a Nerd Font / Powerline-Extra patched font.
#
#  Window pills and the clock are two-tone: a darker block (window index,
#  date) butts straight into the main fill with no glyph between them, so the
#  left cap takes the dark block's colour and the right cap the main fill's.
#
#  Session vs window: the session is not a capsule at all — it is bare
#  #9ab5dd text, then a #727f92 heavy divider (┃ U+2503) separating it from
#  the window run. Windows are capsules; the session is a label. Note the
#  caps are SOLID half-discs, not outline strokes, so an "unfilled pill" is
#  not achievable — dropping the fill just leaves two blobs either side of
#  the text. Capsule vs no capsule is the only shape axis these glyphs give.
# ═══════════════════════════════════════════════════════════

# True colour (RGB) is switched on in tmux.conf — the palette degrades badly
# without it.

# ── Status bar ───────────────────────────────────────────
set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=#909bad"

# Left: session label — bare text, no capsule, then the group divider
set -g status-left-length 40
set -g status-left "#[fg=#9ab5dd,bg=default,bold]  #S  #[fg=#727f92,nobold]┃  "

# Right: mode pill (amber while the prefix is armed, blue in copy mode,
# otherwise nothing) · date+time capsule
set -g status-right-length 90
set -g status-right "#{?client_prefix,#[fg=#dcb27e#,bg=default]#[fg=#0f131b#,bg=#dcb27e#,bold]PREFIX#[fg=#dcb27e#,bg=default#,nobold] ,#{?#{==:#{pane_mode},copy-mode},#[fg=#7794c7#,bg=default]#[fg=#0f131b#,bg=#7794c7#,bold]COPY#[fg=#7794c7#,bg=default#,nobold] ,}}#[fg=#2e405e,bg=default]#[fg=#9ab5dd,bg=#2e405e]%a %d %b #[fg=#0f131b,bg=#9ab5dd,bold] %H:%M#[fg=#9ab5dd,bg=default,nobold] "

# Windows: one pill each, gap between them. Names are cut at 20 columns, and
# a zoomed window gets  after its name.
set -g window-status-separator " "
set -g window-status-format         "#[fg=#{?window_bell_flag,#dcb27e,#{?window_activity_flag,#7794c7,#2c3442}},bg=default]#[fg=#{?window_bell_flag,#0f131b,#{?window_activity_flag,#0f131b,#727f92}},bg=#{?window_bell_flag,#dcb27e,#{?window_activity_flag,#7794c7,#2c3442}}]#I #[fg=#{?window_bell_flag,#0f131b,#{?window_activity_flag,#0f131b,#909bad}},bg=#{?window_bell_flag,#dcb27e,#{?window_activity_flag,#7794c7,#202733}}] #{=/20/…:window_name}#{?window_zoomed_flag, ,} #[fg=#{?window_bell_flag,#dcb27e,#{?window_activity_flag,#7794c7,#202733}},bg=default]"
set -g window-status-current-format "#[fg=#2e405e,bg=default]#[fg=#9ab5dd,bg=#2e405e,bold]#I #[fg=#0f131b,bg=#9ab5dd] #{=/20/…:window_name}#{?window_zoomed_flag, ,} #[fg=#9ab5dd,bg=default,nobold]"

# Window names (unless renamed by hand) say what the active pane is doing:
# the running program, or for an idle shell the directory it sits in.
# Claude Code's executable is named after its version (2.1.312), so a bare
# version number reads as "claude".
set -g automatic-rename-format "#{?#{m/r:^(zsh|bash|fish|sh)$,#{pane_current_command}},#{b:pane_current_path},#{?#{m/r:^[0-9]+([.][0-9]+)+$,#{pane_current_command}},claude,#{pane_current_command}}}"

# Activity / bell are folded into the pill fill above, so these style
# options are neutralised to stop them overriding the pill colours.
# Activity highlighting is OFF for now — background windows stay dark instead
# of turning #7794c7. Flip this back to "on" to restore the blue; the ding will
# not come back with it, because activity-action below stays at none.
setw -g monitor-activity off
set  -g visual-activity off
# activity-action none = highlight only, no audible bell on activity. Despite
# the man page calling it "equivalent to monitor-activity being off", the
# window_activity_flag is still set, so the pill still turns blue — measured,
# not assumed. Leaving this at the default "other" makes tmux emit a BEL to
# the terminal every time a background window writes output.
# This does NOT touch real application bells; those follow bell-action.
set  -g activity-action none
set  -g window-status-activity-style default
set  -g window-status-bell-style     default

# ── Panes ────────────────────────────────────────────────
set -g pane-border-style         "fg=#2c3442"
set -g pane-active-border-style  "fg=#9ab5dd"
set -g display-panes-colour        "#5f7fb3"
set -g display-panes-active-colour "#9ab5dd"

# ── Copy mode / selection / search ───────────────────────
set -g mode-style "bg=#2e405e,fg=#e0e6f0"
set -g copy-mode-match-style         "bg=#5f7fb3,fg=#0f131b"
set -g copy-mode-current-match-style "bg=#9ab5dd,fg=#0f131b"
set -g copy-mode-mark-style          "bg=#9ab5dd,fg=#0f131b"
set -g copy-mode-position-style      "bg=#202733,fg=#9ab5dd"

# ── Menus (right-click, prefix + <) and popups ───────────
# Menus open straight over pane text on the same dark canvas, so their border
# is blue: in #2c3442 the frame and the title on it all but vanish.
set -g menu-style          "bg=#151921,fg=#909bad"
set -g menu-selected-style "bg=#9ab5dd,fg=#0f131b,bold"
set -g menu-border-style   "fg=#5f7fb3"
set -g menu-border-lines   rounded
set -g popup-style         "bg=#151921"
set -g popup-border-style  "fg=#2c3442"
set -g popup-border-lines  rounded

# ── Command / message line ───────────────────────────────
# Accent text straight on the bar, not a solid strip across it
set -g message-style         "bg=default,fg=#9ab5dd,bold"
set -g message-command-style "bg=default,fg=#7794c7,bold"
set -g prompt-cursor-colour  "#9ab5dd"

# ── Clock (prefix + t) ───────────────────────────────────
set -g clock-mode-colour "#9ab5dd"
set -g clock-mode-style  24
