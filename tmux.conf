# ═══════════════════════════════════════════════════════════
#  tmux configuration — unified blue theme
#  Colours and the status bar live in pill-theme.conf, sourced near the end.
# ═══════════════════════════════════════════════════════════

# ── General ──────────────────────────────────────────────
set  -g base-index 1
# Panes count from 1 too, matching windows. If you change this, save with
# prefix + C-s straight after: tmux-resurrect restores panes by index, and a
# snapshot taken under the old numbering comes back with split panes missing.
setw -g pane-base-index 1
set  -g renumber-windows on    # closing window 2 of 1 2 3 leaves 1 2, not 1 3
set  -g history-limit 50000    # scrollback lines per pane (default 2000)
set  -g display-time 2000      # messages stay up long enough to read
set  -g focus-events on
set  -g set-titles on          # iTerm2 tab title follows tmux
set  -g set-titles-string "#S · #W"
# Let programs reach iTerm2 directly, so inline images (imgcat, yazi
# previews) render inside tmux. Only the visible pane gets through.
setw -g allow-passthrough on

# ── Terminal ─────────────────────────────────────────────
set -s  default-terminal "tmux-256color"
set -sg escape-time 10
# `set -a` appends, so reset to the defaults first, or every re-source
# stacks another copy of the lines below.
set -su terminal-features
set -as terminal-features ',*:RGB'          # true colour — the theme needs it
# Pass through extended (CSI-u) keys like Shift+Enter to apps (Claude Code, etc.)
set -s  extended-keys on
set -as terminal-features 'xterm*:extkeys'

# ── Pane navigation (prefix, or iTerm2 remaps) ───────────
bind h select-pane -L
bind l select-pane -R
bind j select-pane -D
bind k select-pane -U

# ── Window navigation (no prefix) ────────────────────────
bind -n M-q previous-window   # option + q → window left
bind -n M-w next-window       # option + w → window right

# ── Resize panes (prefix, repeatable) ────────────────────
bind -r Left  resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up    resize-pane -U 2
bind -r Down  resize-pane -D 2

# ── Splits and new windows (open in the current pane's directory) ──
bind v split-window -h -c "#{pane_current_path}"   # prefix + v → vertical split
bind s split-window -v -c "#{pane_current_path}"   # prefix + s → horizontal split
bind c new-window      -c "#{pane_current_path}"

# ── Reload (prefix + R) ──────────────────────────────────
bind R source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# ── Copy mode (vi keys) ──────────────────────────────────
# prefix + [ to enter, v to select, C-v for a block, y to copy. Copies reach
# the macOS clipboard through iTerm2 (OSC 52), which iTerm2 allows under
# Settings → General → Selection → "Applications in terminal may access clipboard".
setw -g mode-keys vi
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-pipe-and-cancel

# ── Mouse ────────────────────────────────────────────────
# Click to focus a pane or window, drag borders to resize, wheel to scroll.
# This lives here rather than as a runtime `tmux set -g mouse on`, because a
# runtime option dies with the tmux server on every reboot. tmux-resurrect
# restores sessions and panes, not global options.
# To select text with iTerm2 instead of tmux, hold Option while dragging.
set -g mouse on

# ═══════════════════════════════════════════════════════════
#  Plugins (TPM) — keep the run line last
# ═══════════════════════════════════════════════════════════
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # session save/restore
set -g @plugin 'tmux-plugins/tmux-continuum'   # auto-save + auto-restore
set -g @plugin 'omerxx/tmux-sessionx'

set -g @continuum-restore 'on'
# Repairs save lines that resurrect shifts when a pane title is empty, which
# made those panes restore in $HOME. Details in the script.
set -g @resurrect-hook-post-save-layout '~/.config/tmux/resurrect-fix-save.sh'
# Restore what each pane last showed, not a blank screen
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-delete-backup-after '7'   # days of snapshots to keep (default 30)
# Restart Claude Code; resurrect-fix-save.sh rewrites its saved command to
# resume the same session (claude-pane-session.sh records which one)
set -g @resurrect-processes 'claude'


set -g @sessionx-bind 'M-a'              # option + a, no prefix (see @sessionx-prefix)
# Typing a name no session matches makes a session in zoxide's best folder
# for it (magcore-app -> ~/work/magcore/magcore-app). The ctrl-f list of
# every zoxide folder is unbound below.
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-fzf-builtin-tmux 'on' # skip the fzf-tmux script (needs fzf >= 0.53)
set -g @sessionx-prefix off
set -g detach-on-destroy off
# Layout: prompt on top with rows reading down from it, and the preview
# under the list. sessionx-frame.py sets the preview's height as the popup
# opens, so the list box is only as tall as the session list (5 rows at most,
# then it scrolls) and the preview gets the rest.
set -g @sessionx-window-height '70%'
set -g @sessionx-window-width '75%'
set -g @sessionx-layout 'reverse'
set -g @sessionx-preview-location 'down'
set -g @sessionx-preview-ratio '70%'
# Prompt icon is U+EBC8 (the plugin's default tmux glyph), written as an
# escape because pasted Private Use Area glyphs get stripped in transit.
# The trailing space keeps it from crowding the query.
set -g @sessionx-prompt " "
set -g @sessionx-pointer "▌"
set -g @sessionx-ls-command 'lsd --tree --color=always --icon=always'
# "Legacy" only drops two plugin args: a border label frozen at config-load
# time (sessionx-frame.py sets a live one), and a focus bind that labels the
# preview with the whole row (the preview's bottom row names the session
# instead). Nothing else in the plugin reads it.
set -g @sessionx-legacy-fzf-support 'on'

# Extra fzf options. sessionx passes them before its own, so where both set
# an option the plugin's wins, except --preview-window, which fzf merges.
# sessionx evals this string as a bash array literal, so each bind is in
# single quotes: bare parens are a syntax error there.
# Palette mirrors ~/.config/tmux/pill-theme.conf so the popup reads as the same system:
#   #151921 canvas · #202733 pill · #727f92 dim · #909bad text · #e0e6f0 bright
#   #9ab5dd accent · #7794c7 accent mid · #2c3442 border · #dcb27e warn
set -g  @sessionx-additional-options "--color=bg:#151921,bg+:#202733,fg:#909bad,fg+:#e0e6f0,hl:#7794c7,hl+:#9ab5dd,info:#727f92,prompt:#9ab5dd,pointer:#9ab5dd,marker:#dcb27e,spinner:#7794c7,header:#727f92,border:#2c3442,label:#9ab5dd,query:#e0e6f0,scrollbar:#2c3442,separator:#2c3442,preview-border:#2c3442,gutter:#151921,list-border:#2c3442,input-border:#2c3442,ghost:#727f92"
# Search box and list in boxes of their own, the match count inside the
# search box, the key legend centred on the list box's top edge, and the
# focused row lit across its whole width. --margin=0 undoes the 2% margin
# FZF_DEFAULT_OPTS in ~/.zshrc gives every fzf: 2% of the popup's width is
# 3 columns but 2% of its height rounds to 0 rows, so the border sat inset
# at the sides and flush at the top and bottom.
set -ga @sessionx-additional-options " --margin=0 --border=rounded --border-label-pos=3 --input-border=rounded --list-border=rounded --list-label-pos=0 --info=inline-right --highlight-line --ghost='switch, or type a name or folder to create'"
set -ga @sessionx-additional-options " --preview-window='border-rounded,noinfo'"
# Match on a row's session name and directory (its first and last fields),
# not on its age or window count
set -ga @sessionx-additional-options " --nth=1,-1"
# start: loads rows with age, windows and directory (sessionx-list.py) in
#   place of the plugin's bare names; hides the plugin's header; swaps in a
#   preview of every pane plus the session's windows (sessionx-preview.py);
#   unbinds the plugin keys left out of the legend, at their default names:
#   windows (ctrl-w), tree (ctrl-t), back (ctrl-b), preview toggle (?),
#   preview scroll (ctrl-u, ctrl-d) and the zoxide folder list (ctrl-f); and
#   sets the border label, key legend and preview height (sessionx-frame.py)
# load: the plugin's kill and rename keys reload bare session names;
#   sessionx-frame.py swaps the full rows back in and refits the list box.
#   The shell test skips Python for an empty list and for a row with a
#   space or slash in it, which is full rows or a folder already.
# resize: refits the preview to the new height
set -ga @sessionx-additional-options " --bind 'start:reload(~/.config/tmux/sessionx-list.py)+hide-header+change-preview(~/.config/tmux/sessionx-preview.py {})+unbind(ctrl-w,ctrl-t,ctrl-b,?,ctrl-u,ctrl-d,ctrl-f)+transform(~/.config/tmux/sessionx-frame.py)'"
set -ga @sessionx-additional-options " --bind 'load:transform([[ -z {} || {} == *[[:space:]/]* ]] || ~/.config/tmux/sessionx-frame.py --if-bare {})'"
set -ga @sessionx-additional-options " --bind 'resize:transform(~/.config/tmux/sessionx-frame.py)'"


# ── Status bar theme ─────────────────────────────────────
# Before the TPM run line: tmux-continuum hooks its auto-save into
# status-right, so the theme has to set status-right first.
source-file ~/.config/tmux/pill-theme.conf

run '~/.config/tmux/plugins/tpm/tpm'
