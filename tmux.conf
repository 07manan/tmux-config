# ═══════════════════════════════════════════════════════════
#  tmux configuration — unified blue theme
# ═══════════════════════════════════════════════════════════

# ── General ──────────────────────────────────────────────
set -g base-index 1
set -g focus-events on

# ── Pane navigation (prefix, or iTerm2 remaps) ───────────
bind h select-pane -L
bind l select-pane -R
bind j select-pane -D
bind k select-pane -U

# ── Window navigation (no prefix) ────────────────────────
bind -n M-q previous-window   # option + q → window left
bind -n M-w next-window       # option + w → window right

# ── Resize panes (prefix, repeatable) ────────────────────
bind -r Left  resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up    resize-pane -U 2
bind -r Down  resize-pane -D 2

# ── Splits ───────────────────────────────────────────────
bind v split-window -h   # prefix + v → vertical split
bind s split-window -v   # prefix + s → horizontal split

# ── Mouse ────────────────────────────────────────────────
# Click to focus a pane or window, drag borders to resize, wheel to scroll.
# This lives here rather than as a runtime `tmux set -g mouse on`, because a
# runtime option dies with the tmux server on every reboot. tmux-resurrect
# restores sessions and panes, not global options.
# To select text with iTerm2 instead of tmux, hold Option while dragging.
set -g mouse on

# ═══════════════════════════════════════════════════════════
#  Theme — blue palette (256-color)
#  base bg     colour234  #1c1c1c
#  text        colour250  #bcbcbc
#  text dim    colour244  #808080
#  accent      colour117  #87d7ff   active / current
#  accent deep colour32   #0087d7   secondary blue
#  selection   colour24   #005f87   dark-blue fill
#  ink on blue colour235  #262626   text on light-blue bg
#  border dim  colour238  #444444
# ═══════════════════════════════════════════════════════════

# ── Status bar ───────────────────────────────────────────
set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=colour234,fg=colour250"
set -g status-position bottom

# Left: session name in accent block
set -g status-left-length 30
set -g status-left "#[fg=colour235,bg=colour117,bold] #S #[default] "

# Right: prefix indicator · day · time · date
set -g status-right-length 60
set -g status-right "#{?client_prefix,#[fg=colour235#,bg=colour117#,bold] PREFIX ,}#[fg=colour244,bg=colour234] %a #[fg=colour250]%H:%M #[fg=colour235,bg=colour117,bold] %d %b "

# Windows (flush, no default separator)
set -g window-status-separator ""
set -g window-status-current-format "#[fg=colour235,bg=colour117,bold] #I:#W "
set -g window-status-format         "#[fg=colour244,bg=colour234] #I:#W "

# Activity / bell highlighting (remove the two monitor lines if too noisy)
setw -g monitor-activity on
set  -g visual-activity off
set -g window-status-activity-style "fg=colour117,bg=colour234,bold"
set -g window-status-bell-style     "fg=colour235,bg=colour117,bold"

# ── Panes ────────────────────────────────────────────────
set -g pane-border-style         "fg=colour238"   # inactive — dim gray
set -g pane-active-border-style  "fg=colour117"   # active — was green, now blue
set -g display-panes-colour        colour32        # prefix + q numbers
set -g display-panes-active-colour colour117

# ── Copy mode / selection / search ───────────────────────
set -g mode-style "bg=colour24,fg=colour231"        # visible blue selection
set -g copy-mode-match-style         "bg=colour32,fg=colour234"
set -g copy-mode-current-match-style "bg=colour117,fg=colour235"
set -g copy-mode-mark-style          "bg=colour117,fg=colour235"

# ── Command / message line ───────────────────────────────
set -g message-style         "bg=colour117,fg=colour235"
set -g message-command-style "bg=colour32,fg=colour231"

# ── Clock (prefix + t) ───────────────────────────────────
set -g clock-mode-colour colour117
set -g clock-mode-style  24

# ── Keys / responsiveness ────────────────────────────────
set -sg escape-time 10
# Pass through extended (CSI-u) keys like Shift+Enter to apps (Claude Code, etc.)
set -s  extended-keys on
set -as terminal-features 'xterm*:extkeys'

# ═══════════════════════════════════════════════════════════
#  Plugins (TPM) — keep the run line last
# ═══════════════════════════════════════════════════════════
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # session save/restore
set -g @plugin 'tmux-plugins/tmux-continuum'   # auto-save + auto-restore
set -g @plugin 'omerxx/tmux-sessionx'

set -g @continuum-restore 'on'


set -g @sessionx-bind 'M-a'              # take over prefix+s
set -g @sessionx-zoxide-mode 'on'      # non-matching query falls through to zoxide
set -g @sessionx-fzf-builtin-tmux 'on' # skip the fzf-tmux script (needs fzf >= 0.53)
set -g @sessionx-window-height '70%'
set -g @sessionx-window-width '75%'
set -g @sessionx-preview-ratio '75%'
set -g @sessionx-prefix off
set -g detach-on-destroy off
set -g popup-border-style 'fg=#2c333f'   # BORD — matches inactive pane border
set -g popup-border-lines rounded
set -g popup-style 'bg=#16181d'          # BG — same canvas as the status bar
set -g @sessionx-prompt "  "        # trailing space so it doesn't crowd the icon
set -g @sessionx-pointer "▶ "
set -g @sessionx-ls-command 'lsd --tree --color=always --icon=always'
# Palette mirrors ~/.config/tmux/pill-theme.conf so the popup reads as the same system:
#   #16181d bar bg · #232830 pill · #6b7684 dim · #8b96a5 text · #dce6f2 bright
#   #87d7ff accent · #3fa9e0 accent mid · #2c333f border · #f0b072 warn
# The single-quotes around start:reload(...) are required — sessionx evals this
# string as a bash array literal, and bare parens are a syntax error there.
set -g @sessionx-additional-options "--color=bg:#16181d,bg+:#232830,fg:#8b96a5,fg+:#dce6f2,hl:#3fa9e0,hl+:#87d7ff,info:#6b7684,prompt:#87d7ff,pointer:#87d7ff,marker:#f0b072,spinner:#3fa9e0,header:#6b7684,border:#2c333f,label:#87d7ff,query:#dce6f2,scrollbar:#2c333f,separator:#2c333f,preview-border:#2c333f,gutter:#16181d --bind 'start:reload(~/.config/tmux/sessionx-mru.sh)+transform-border-label(~/.config/tmux/sessionx-label.sh)'"


# ── Status bar theme ─────────────────────────────────────
# Sourced last so its pill styling wins over the colour234/117 theme above.
source-file ~/.config/tmux/pill-theme.conf

run '~/.config/tmux/plugins/tpm/tpm'
